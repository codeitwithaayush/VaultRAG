version: '3.8'

services:
  rag-api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      - PDF_FOLDER=/app/documents
      # Point to the host machine's LLM server running on port 12434
      - QWEN_API_URL=http://host.docker.internal:12434/v1/chat/completions
    volumes:
      # Mount the user's host PDFs directory to /app/documents in the container
      - ${PDF_FOLDER_HOST:-/Users/avummdedhiaa/Documents/PDFs}:/app/documents
      # Persist vectorstore index inside the container
      - ./vectorstore:/app/vectorstore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      # Connect to the rag-api container's port 8000
      - OPENAI_API_BASE_URL=http://rag-api:8000/v1
      - OPENAI_API_KEY=dummy
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - rag-api
    restart: always

volumes:
  open-webui-data:
